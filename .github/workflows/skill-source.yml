name: Skill source
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, default depth one
      - name: Install source-check dependencies
        run: |
          python3 -m venv .source-check-venv
          .source-check-venv/bin/python -m pip install -r tests/requirements.txt
      - name: Check whitespace and disclosed references
        shell: bash
        run: |
          git show --format= --check HEAD
          .source-check-venv/bin/python scripts/check-source.py
      - name: Test source guard rejection and checkout behavior
        run: .source-check-venv/bin/python -m unittest discover -s tests -v
